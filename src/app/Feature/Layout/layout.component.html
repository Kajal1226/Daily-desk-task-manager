<div class="w-screen h-screen flex flex-col bg-slate-50 text-gray-800">
  <!-- Header -->
  <div
    class="bg-slate-500 h-[4rem] flex items-center justify-center relative shadow-lg"
  >
    <button
      class="block md:hidden absolute left-4 text-black hover:text--700 px-2 py-1 focus:outline-none"
      (click)="toggleSidebar()"
      aria-label="Toggle sidebar"
    >
      @if (isSidebarOpen) {
      <i class="fa-solid fa-xmark text-xl"></i>
      } @else {
      <i class="fa-solid fa-bars text-xl"></i>
      }
    </button>

    <span class="text-xl font-bold text-white tracking-wide">Daily-Desk</span>
  </div>

  <!-- Body -->
  <div class="flex flex-1 relative">
    <!-- Sidebar -->
    <div
      [ngClass]="{
        'translate-x-0': isSidebarOpen,
        '-translate-x-full': !isSidebarOpen
      }"
      class="absolute md:relative z-50 transition-transform duration-300 ease-in-out w-2/3 md:w-1/6 bg-blue-300 h-full"
    >
      <nav class="space-y-4 p-4 text-white">
        <a
          routerLink="/reporting"
          routerLinkActive="bg-sky-700 font-semibold text-white"
          class="flex items-center gap-2 py-2 px-3 rounded-md hover:bg-sky-700 transition text-sm font-medium"
        >
          📊 <span>Reporting</span>
        </a>
        <a
          routerLink="/schedule"
          routerLinkActive="bg-sky-700 font-semibold text-white"
          class="flex items-center gap-2 py-2 px-3 rounded-md hover:bg-sky-700 transition text-sm font-medium"
        >
          ✅ <span>Schedule</span>
        </a>
      </nav>
    </div>

    <!-- Main Content -->
    <div class="flex-1 h-full overflow-auto bg-slate-50 p-4">
      <main>
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
</div>
