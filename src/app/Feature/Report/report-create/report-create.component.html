<div class="min-h-screen bg-gray-50 px-4 py-6">
    
    <div 
      class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-md"
    >
      <h3 class="text-xl font-semibold text-gray-800 mb-4">Create a New Report</h3>
      <form [formGroup]="ReportForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div>
          <label class="block text-gray-700 font-medium mb-1">Title</label>
          <input
            type="text"
            formControlName="title"
            placeholder="Enter Title"
            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none text-gray-900"
          />
        </div>
  
        <div>
          <label class="block text-gray-700 font-medium mb-1">Description</label>
          <input
            type="text"
            formControlName="description"
            placeholder="Enter Description"
            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none text-gray-900"
          />
        </div>
  
        <div class="text-right">
          <button
            type="submit"
            class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2 rounded-md transition shadow"
          >
            Submit
          </button>
        </div>
      </form>
    </div>
  

  </div>
