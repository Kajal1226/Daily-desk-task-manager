<!-- Report Wrapper -->
<div class="min-h-screen bg-gray-50 px-4 py-6">
    <!-- Report Header -->
    <header class="mb-6">
      <div class="max-w-6xl mx-auto flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <h2 class="text-2xl sm:text-3xl font-bold text-gray-800 text-center sm:text-left">
          📊 Reporting
        </h2>
        <div class="flex justify-center sm:justify-end">
          <button
            (click)="goToCreateReport()"
            class="bg-green-600 hover:bg-green-700 text-white font-medium px-4 py-2 rounded-md shadow transition"
          >
            Create Report
          </button>
        </div>
      </div>
    </header>
  
    <!-- Task Table -->
    <ng-container *ngIf="!showForm && (tasks$ | async) as tasks">
      <div class="max-w-6xl mx-auto px-2 sm:px-4 lg:px-8 py-4">
        <ng-container *ngIf="tasks.length > 0; else noData">
          <div class="overflow-x-auto border border-gray-300 rounded-lg shadow-sm">
            <table class="min-w-full text-sm text-left">
              <thead class="bg-blue-600 text-white uppercase text-xs">
                <tr>
                  <th class="px-4 py-3 font-semibold text-black whitespace-nowrap">ID</th>
                  <th class="px-4 py-3 font-semibold text-black whitespace-nowrap">Task</th>
                  <th class="px-4 py-3 font-semibold text-black whitespace-nowrap">Edit</th>
                  <th class="px-4 py-3 font-semibold text-black whitespace-nowrap">Delete</th>
                  <th class="px-4 py-3 font-semibold text-black whitespace-nowrap">View</th>
                </tr>
              </thead>
              <tbody class="bg-white text-gray-900 divide-y divide-gray-200">
                <tr *ngFor="let task of tasks" class="hover:bg-gray-100 transition">
                  <td class="px-4 py-2 text-center">{{ task.id }}</td>
                  <td class="px-4 py-2">{{ task.title }}</td>
                  <td class="px-4 py-2 text-center">
                    <button
                      (click)="editTask(task)"
                      class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded-md transition"
                    >
                      Edit
                    </button>
                  </td>
                  <td class="px-4 py-2 text-center">
                    <button
                      (click)="deleteTask(task.id ?? 0)"
                      class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded-md transition"
                    >
                      Delete
                    </button>
                  </td>
                  <td class="px-4 py-2 text-center">
                    <button
                      (click)="openDialog(task.id ?? 0)"
                      class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-1 rounded-md transition"
                    >
                      View
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </ng-container>
  
        <!-- Empty State -->
        <ng-template #noData>
          <div class="text-center py-10 text-gray-600 text-lg">
            😕 No tasks available. Try creating a report!
          </div>
        </ng-template>
      </div>
    </ng-container>
  
    <!-- Router Outlet -->
    <router-outlet></router-outlet>
  </div>
