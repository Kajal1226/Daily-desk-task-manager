<ng-container *ngIf="tasks$ | async as tasks">
    <div
      class="w-full max-w-sm md:max-w-md bg-zinc-900 text-white rounded-2xl p-6 shadow-lg border border-blue-400 mx-auto"
    >
      <!-- Header -->
      <h2 class="text-2xl font-semibold flex items-center gap-2 mb-4">
        📝 Task Details
      </h2>
  
      <!-- Content -->
      <div class="space-y-3">
        <p>
          <span class="font-bold text-lg text-white">Title:</span>
          <span class="text-base">{{ tasks.title }}</span>
        </p>
        <p>
          <span class="font-bold text-lg text-white">Description:</span>
          <span class="text-base">{{ tasks.description }}</span>
        </p>
      </div>
  
      <!-- Footer / Actions -->
      <div class="mt-6 flex justify-end">
        <button
          (click)="onClose()"
          class="bg-gradient-to-r from-purple-500 to-blue-500 text-white px-5 py-2 rounded-full shadow-md hover:from-purple-600 hover:to-blue-600 transition-all duration-200"
        >
          Close
        </button>
      </div>
    </div>
  </ng-container>
