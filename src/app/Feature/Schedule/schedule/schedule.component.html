<div class="min-h-screen bg-gray-50 px-4 py-6">
  <!-- Header -->
  <header class="mb-6">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
      <h2 class="text-2xl sm:text-3xl font-bold text-gray-800 text-center sm:text-left">
        📅 Schedule
      </h2>
      <button
        (click)="goToCreateSchedule()"
        class="bg-green-600 hover:bg-green-700 text-white font-medium px-4 py-2 rounded-md shadow transition"
      >
        Create Report
      </button>
    </div>
  </header>

  <!-- Task Table -->
  <ng-container *ngIf="tasks().length > 0; else noData">
    <div class="max-w-6xl mx-auto px-2 sm:px-4 lg:px-8 py-6 overflow-x-auto">
      <table class="min-w-full border border-gray-200 text-sm">
        <!-- Table Head -->
        <thead class="bg-blue-600 text-white uppercase text-xs">
          <tr>
            <th class="px-4 py-3 font-semibold text-black text-left whitespace-nowrap">ID</th>
            <th class="px-4 py-3 font-semibold text-black text-left whitespace-nowrap">Title</th>
            <th class="px-4 py-3 font-semibold text-black text-left whitespace-nowrap">Description</th>
            <th class="px-4 py-3 font-semibold text-black text-left whitespace-nowrap">Date</th>
            <th class="px-4 py-3 font-semibold text-black text-left whitespace-nowrap">Completed</th>
            <th class="px-4 py-3 font-semibold text-black text-left whitespace-nowrap">Edit</th>
            <th class="px-4 py-3 font-semibold text-black text-left whitespace-nowrap">Delete</th>
            <th class="px-4 py-3 font-semibold text-black text-left whitespace-nowrap">View</th>
          </tr>
        </thead>

        <!-- Table Body -->
        <tbody class="bg-white text-gray-800 divide-y divide-gray-200">
          <tr
            *ngFor="let t of tasks(); let i = index"
            class="hover:bg-gray-100 transition duration-200"
          >
            <td class="px-4 py-3 text-center">{{ t.id }}</td>
            <td class="px-4 py-3 text-center">{{ t.title }}</td>
            <td class="px-4 py-3 text-center">{{ t.description }}</td>
            <td class="px-4 py-3 text-center">{{ t.date }}</td>
            <td class="px-4 py-3 text-center">
              <input
                type="checkbox"
                [(ngModel)]="t.completed"
                (change)="toggleComplete(t)"
                class="accent-blue-500 w-4 h-4"
              />
            </td>
            <td class="px-4 py-3 text-center">
              <button
                class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded shadow-sm transition"
                (click)="editSchedule(t)"
              >
                Edit
              </button>
            </td>
            <td class="px-4 py-3 text-center">
              <button
                class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded shadow-sm transition"
                (click)="deleteSchedule(t.id!)"
              >
                Delete
              </button>
            </td>
            <td class="px-4 py-3 text-center">
              <button
                class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-1 rounded shadow-sm transition"
                (click)="openDialog(t.id ?? 0)"
              >
                View
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </ng-container>

  <!-- No Data Template -->
  <ng-template #noData>
    <div class="text-center text-gray-600 mt-10 text-lg">
      😕 No tasks available. Try creating a schedule!
    </div>
  </ng-template>

  <router-outlet></router-outlet>
</div>
